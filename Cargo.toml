[workspace]
resolver = "2"
members = [
    "crates/keel-math",
    "crates/keel-geom",
    "crates/keel-topo",
    "crates/keel-wasm",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/keel-kernel/keel"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[workspace.dependencies]
robust = "1"
proptest = "1"
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
