[package]
name = "keel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
keel-math = { path = "../crates/keel-math" }
keel-geom = { path = "../crates/keel-geom" }
keel-topo = { path = "../crates/keel-topo" }

[[bin]]
name = "fuzz_solve_cubic"
path = "fuzz_targets/fuzz_solve_cubic.rs"
test = false
doc = false

[[bin]]
name = "fuzz_bernstein_roots"
path = "fuzz_targets/fuzz_bernstein_roots.rs"
test = false
doc = false

[[bin]]
name = "fuzz_nurbs_curve"
path = "fuzz_targets/fuzz_nurbs_curve.rs"
test = false
doc = false

[[bin]]
name = "fuzz_nurbs_surface"
path = "fuzz_targets/fuzz_nurbs_surface.rs"
test = false
doc = false

[[bin]]
name = "fuzz_topo_ops"
path = "fuzz_targets/fuzz_topo_ops.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pmc"
path = "fuzz_targets/fuzz_pmc.rs"
test = false
doc = false

[[bin]]
name = "fuzz_interval"
path = "fuzz_targets/fuzz_interval.rs"
test = false
doc = false

[[bin]]
name = "fuzz_ssi"
path = "fuzz_targets/fuzz_ssi.rs"
test = false
doc = false

[[bin]]
name = "fuzz_imprint"
path = "fuzz_targets/fuzz_imprint.rs"
test = false
doc = false

[[bin]]
name = "fuzz_boolean"
path = "fuzz_targets/fuzz_boolean.rs"
test = false
doc = false
